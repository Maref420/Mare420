[package]
name = "specgen"
version = "0.1.0"
edition = "2021"
authors = ["Atlas AI"]
description = "Atlas AI Specification Generator"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[[bin]]
name = "specgen"
path = "src/main.rs"
