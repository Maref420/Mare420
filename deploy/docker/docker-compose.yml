# Atlas AI — Docker Compose Orchestration
# Governance: All services follow Matrix ownership (A=Rust, B=Go, C=Python)
# Usage: docker compose -f deploy/docker/docker-compose.yml up --build

services:
  ingestion:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.ingestion
    ports:
      - "${INGESTION_PORT:-8080}:8080"
    volumes:
      - uds_socket:/app/uds
    environment:
      - PORT=8080
      - LOG_FORMAT=json
    networks:
      - atlas_net
    depends_on:
      broker:
        condition: service_healthy
    restart: unless-stopped

  broker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.message-broker
    ports:
      - "${BROKER_PORT:-8081}:8081"
    environment:
      - PORT=8081
      - LOG_FORMAT=json
    networks:
      - atlas_net
    restart: unless-stopped

  agent:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.agent
    volumes:
      - sqlite_data:/app/data
      - uds_socket:/app/uds
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - ATLAS_MEMORY_DB=/app/data/memory.db
    networks:
      - atlas_net
    depends_on:
      ipc_server:
        condition: service_started
    restart: unless-stopped

  ipc_server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.ipc-server
    volumes:
      - uds_socket:/app/uds
    environment:
      - IPC_SOCKET_PATH=/app/uds/atlas-ipc.sock
      - RUST_LOG=info
    networks:
      - atlas_net
    restart: unless-stopped

  # ─── PHASE 18 G4 ADDITIONS ──────────────────────────────────────
  # Governed by: Rule 12 (Minimal Blast Radius) - Additive only
  # These services extend the existing stack with persistent storage,
  # event bus, and commercial observability without modifying any
  # existing service definitions.

  nats-broker:
    image: nats:2.10-alpine
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "8222:8222"
    command: ["--js", "--http_port", "8222"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - atlas_net
    restart: unless-stopped

  postgres-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas_secret_change_me}
      POSTGRES_DB: atlas_memory
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - atlas_data:/var/lib/postgresql/data
      - ../../scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas_memory"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - atlas_net
    restart: unless-stopped

  observability-api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.agent
    ports:
      - "${OBSERVABILITY_PORT:-8787}:8787"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - NATS_URL=nats://nats-broker:4222
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
      - OBSERVABILITY_PORT=8787
    env_file:
      - ../../.env
    command: >
      sh -c "python -c 'from intelligence.observability.api import start_server; start_server(host="0.0.0.0", port=8787)'"
    networks:
      - atlas_net
    depends_on:
      agent:
        condition: service_started
      nats-broker:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8787/api/v1/pipeline/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

networks:
  atlas_net:
    driver: bridge

volumes:
  uds_socket:
    driver: local
  sqlite_data:
    driver: local
  atlas_data:
    driver: local
