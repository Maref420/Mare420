# Atlas AI — Docker Compose Orchestration
# Governance: All services follow Matrix ownership (A=Rust, B=Go, C=Python)
# Usage: docker compose -f deploy/docker/docker-compose.yml up --build

services:
  ingestion:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.ingestion
    ports:
      - "${INGESTION_PORT:-8080}:8080"
    volumes:
      - uds_socket:/app/uds
    environment:
      - PORT=8080
      - LOG_FORMAT=json
    networks:
      - atlas_net
    depends_on:
      broker:
        condition: service_healthy
    restart: unless-stopped

  broker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.message-broker
    ports:
      - "${BROKER_PORT:-8081}:8081"
    environment:
      - PORT=8081
      - LOG_FORMAT=json
    networks:
      - atlas_net
    restart: unless-stopped

  agent:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.agent
    volumes:
      - sqlite_data:/app/data
      - uds_socket:/app/uds
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
      - ATLAS_MEMORY_DB=/app/data/memory.db
    networks:
      - atlas_net
    depends_on:
      ipc_server:
        condition: service_started
    restart: unless-stopped

  ipc_server:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.ipc-server
    volumes:
      - uds_socket:/app/uds
    environment:
      - IPC_SOCKET_PATH=/app/uds/atlas-ipc.sock
      - RUST_LOG=info
    networks:
      - atlas_net
    restart: unless-stopped

networks:
  atlas_net:
    driver: bridge

volumes:
  uds_socket:
    driver: local
  sqlite_data:
    driver: local
