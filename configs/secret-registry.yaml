# Secret Registry — Governed by contracts/schemas/infrastructure/secret-provider-config-v1.json
# All application secrets MUST be registered here.
# ADR-2026-08-30-011
version: "1.0"
provider: env  # Upgrade path: vault | aws_secrets_manager | gcp_secret_manager
provider_config: {}  # Populate when switching provider

secrets:
  - name: jwt_secret_key
    env_var: JWT_SECRET_KEY
    required: true
    min_length: 32
    rotate_days: 90
    consumers:
      - output.secure_api.auth
      - core_engine.auth

  - name: database_url
    env_var: DATABASE_URL
    required: true
    min_length: 10
    rotate_days: 180
    consumers:
      - output.secure_api.database
      - intelligence.agent_control_plane.audit

  - name: supabase_url
    env_var: SUPABASE_URL
    required: false
    min_length: 10
    rotate_days: null
    consumers:
      - intelligence.agent_control_plane.audit

  - name: supabase_key
    env_var: SUPABASE_KEY
    required: false
    min_length: 10
    rotate_days: 90
    consumers:
      - intelligence.agent_control_plane.audit

  - name: setup_test_password
    env_var: SETUP_TEST_PASSWORD
    required: false
    min_length: 8
    rotate_days: 30
    consumers:
      - output.secure_api.setup
