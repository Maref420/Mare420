name: CI Pipeline

on:
  push:
    branches: ['*']
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PYTHONPATH: .

jobs:
  rust-ci:
    name: Rust (auto-discover core_engine + tools)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check all Rust crates
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t CRATES < <(
            find core_engine tools \
              -name Cargo.toml \
              -not -path "*/target/*" \
              -exec dirname {} \; 2>/dev/null | sort
          )

          if [ "${#CRATES[@]}" -eq 0 ]; then
            echo "No Rust crates discovered."
            exit 1
          fi

          echo "Discovered Rust crates:"
          printf ' - %s\n' "${CRATES[@]}"

          for crate in "${CRATES[@]}"; do
            echo "::group::Rust crate: ${crate}"
            (
              cd "${crate}"
              cargo check
              cargo test
              cargo clippy -- -D warnings
            )
            echo "::endgroup::"
          done

  go-ci:
    name: Go (auto-discover services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: |
            services/*/go.sum

      - name: Check all Go services
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t SERVICES < <(
            find services \
              -name go.mod \
              -exec dirname {} \; 2>/dev/null | sort
          )

          if [ "${#SERVICES[@]}" -eq 0 ]; then
            echo "No Go services discovered."
            exit 1
          fi

          echo "Discovered Go services:"
          printf ' - %s\n' "${SERVICES[@]}"

          for svc in "${SERVICES[@]}"; do
            echo "::group::Go service: ${svc}"
            (
              cd "${svc}"

              FILES="$(gofmt -l .)"
              if [ -n "${FILES}" ]; then
                echo "Unformatted files:"
                echo "${FILES}"
                exit 1
              fi

              go vet ./...
              go test -race ./...
              go build ./...
            )
            echo "::endgroup::"
          done

  python-ci:
    name: Python (intelligence + atlas_agent)
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" || python -m pip install -e .
          python -m pip install ruff pytest pydantic

      - name: Lint (ruff)
        run: python -m ruff check intelligence/ atlas_agent/ tests/

      - name: Test (pytest)
        run: python -m pytest tests/ -v --tb=short

  governance-gate:
    name: Governance Gate
    needs: [rust-ci, go-ci, python-ci]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Governance Gate
        shell: bash
        run: |
          set -euo pipefail

          echo "rust-ci result:   ${{ needs.rust-ci.result }}"
          echo "go-ci result:     ${{ needs.go-ci.result }}"
          echo "python-ci result: ${{ needs.python-ci.result }}"

          if [ -f scripts/governance_gate.py ]; then
            python3 scripts/governance_gate.py
          else
            echo "Governance gate script not found, skipping."
          fi
