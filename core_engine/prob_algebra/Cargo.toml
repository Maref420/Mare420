[package]
name = "atlas-prob-algebra"
version = "0.1.0"
edition = "2021"
description = "Atlas AI Probability & Algebra Engine. Governed by Matrix A."
license = "Proprietary"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
nalgebra = "0.33"
statrs = "0.17"
rand = "0.8"
rand_chacha = "0.3"

[lints.rust]
unsafe_code = "forbid"
unused_imports = "deny"
dead_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
