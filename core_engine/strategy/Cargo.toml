[package]
name = "atlas-strategy-engine"
version = "0.1.0"
edition = "2021"
description = "Strategy signal generation engine. Governed by strategy-signal-event-v1.json."
license = "Proprietary"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[lints.rust]
unsafe_code = "forbid"
unused_imports = "deny"
dead_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
