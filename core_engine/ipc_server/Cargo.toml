[package]
name = "atlas-ipc-server"
version = "0.1.0"
edition = "2021"
description = "IPC transport server for agent-engine communication"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4", "serde"] }
atlas-risk-engine = { path = "../risk" }
