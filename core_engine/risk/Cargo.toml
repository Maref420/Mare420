[package]
name = "atlas-risk-engine"
version = "0.1.0"
edition = "2021"
description = "Atlas AI Risk Gate. Pre-execution risk assessment. Governed by docs/task_specs/risk_engine.md."
license = "Proprietary"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"

[lints.rust]
unsafe_code = "forbid"
unused_imports = "deny"
dead_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
