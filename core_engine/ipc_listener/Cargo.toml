[package]
name = "atlas-ipc-listener"
version = "0.1.0"
edition = "2021"
description = "Production-grade IPC listener for traced frames via Unix Domain Socket."
license = "Proprietary"

[[bin]]
name = "atlas-ipc-listener"
path = "src/main.rs"

[dependencies]
atlas-market-data = { path = "../market_data" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "io-util", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[lints.rust]
unsafe_code = "forbid"
unused_imports = "deny"
dead_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
