[package]
name = "arb_orchestrator"
version = "0.1.0"
edition = "2021"
description = "Orchestrator: FeatureEngine signals → ArbGraph → IPC output"

[[bin]]
name = "arb_orchestrator"
path = "src/main.rs"

[dependencies]
feature_engine = { path = "../feature_engine" }
arb_graph = { path = "../arb_graph" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
